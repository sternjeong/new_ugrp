<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf8f3">
  <meta name="description" content="내 관심에서 시작해 연구실과 연구의 가능성을 탐색해 보세요.">
  <title>3분커리 · 내 관심이 연구가 되는 곳</title>
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/platform.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">본문으로 이동</a>
  <header class="header">
    <button class="brand" data-action="home" aria-label="3분커리 처음으로"><span class="brand-mark">3</span>3분커리<span class="brand-dot">.</span></button>
    <nav aria-label="주 메뉴"><button data-action="board" class="nav-button">연구참여 후기</button><button data-action="saved" class="nav-button">나의 탐색 <span id="saved-count">0</span></button><button data-action="inbox" id="inbox-nav" class="nav-button" hidden>쪽지함 <span id="unread-count">0</span></button><button id="account" data-action="account" class="account">로그인 <span aria-hidden="true">↗</span></button></nav>
  </header>
  <main id="main" tabindex="-1"><div class="loading" role="status">탐색을 준비하고 있어요…</div></main>
  <footer><span class="footer-brand">3분커리</span><span>관심에서 시작하는, 나다운 연구의 발견.</span><button class="text-button" data-action="open-feedback">의견 보내기</button><button class="text-button" data-action="privacy">개인정보 처리방침</button><span>POSTECH · PROTOTYPE</span></footer>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="auth-dialog" aria-labelledby="auth-title">
    <button class="close-button" data-action="close-auth" aria-label="닫기">×</button>
    <div class="eyebrow">KEEP EXPLORING</div><h2 id="auth-title">다음 가능성도<br>이어 만나보세요.</h2>
    <p id="auth-description">첫 탐색은 그대로. 로그인하고 다른 연구실도 하나씩 살펴보세요.</p>
    <form id="auth-form">
      <label>이메일<input name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"></label>
      <label>비밀번호<input name="password" type="password" autocomplete="current-password" required minlength="10" maxlength="128" placeholder="10자 이상"></label>
      <div id="register-fields" hidden></div>
      <p id="auth-error" class="error" role="alert"></p>
      <button type="submit" class="primary full" id="auth-submit">로그인하고 이어가기 <span>→</span></button>
    </form>
    <button class="text-button" id="auth-toggle" data-action="toggle-auth">처음 오셨나요? 계정 만들기</button>
    <button class="text-button" id="forgot-link" data-action="forgot">비밀번호를 잊었어요</button>
    <p class="micro">결제 없이 이용할 수 있어요. 가입하면 개인정보 처리방침에 따라 정보를 처리해요.</p>
  </dialog>
  <dialog id="sheet-dialog" class="wide" aria-labelledby="sheet-title">
    <button class="close-button" data-action="close-sheet" aria-label="닫기">×</button>
    <div id="sheet-body"></div>
  </dialog>
  <noscript>이 서비스는 JavaScript를 켜야 사용할 수 있습니다.</noscript>
</body>
</html>
